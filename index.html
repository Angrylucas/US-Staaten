<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staatenkunde — die 50 US-Bundesstaaten lernen</title>
<style>
  :root{
    --asphalt:#0B1117;
    --panel:#121C25;
    --panel2:#16222D;
    --line:#243541;
    --land:#2B3C4A;
    --land-hi:#3B5265;
    --sign:#0B6B4F;
    --sign-dark:#075440;
    --amber:#F4B233;
    --ok:#3FA36B;
    --bad:#D0483F;
    --ink:#EEF3F6;
    --muted:#8397A5;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--asphalt);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:20px;
  }
  .app{max-width:1240px;margin:0 auto}

  /* ---------- Kopf ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .headerRight{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .shield{
    width:38px;height:44px;flex:none;display:grid;place-items:center;
    background:#12324F;color:#fff;font-family:var(--sans);font-weight:800;font-size:17px;
    border:2px solid #fff;border-radius:6px 6px 14px 14px;letter-spacing:-.02em;
  }
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
  .tag{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .modes{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:10px;border:1px solid var(--line)}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 14px;border-radius:6px;transition:background .15s,color .15s;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--sign);color:#fff}

  /* ---------- Layout ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}

  /* ---------- Schild (Signature) ---------- */
  .sign{
    background:var(--sign);border-radius:10px;padding:7px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .sign-inner{border:2px solid rgba(255,255,255,.9);border-radius:6px;padding:16px 20px;min-height:118px;display:flex;flex-direction:column;justify-content:center}
  .sign .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:6px}
  .sign .headline{font-size:clamp(26px,4.4vw,42px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05;color:#fff}
  .sign .sub{font-size:13.5px;color:rgba(255,255,255,.78);margin-top:7px}
  .sign.is-idle{background:var(--panel);box-shadow:none;border:1px solid var(--line)}
  .sign.is-idle .sign-inner{border-color:var(--line)}
  .sign.is-idle .headline{color:var(--muted);font-size:clamp(18px,2.6vw,24px)}
  .sign.is-idle .eyebrow{color:var(--muted)}
  .sign.is-idle .sub{color:var(--muted)}

  .answerbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #answer{
    flex:1 1 220px;min-width:0;background:rgba(255,255,255,.94);border:0;border-radius:5px;
    padding:11px 13px;font-family:var(--sans);font-size:16px;font-weight:600;color:#0B1117;
  }
  #answer:focus{outline:3px solid var(--amber);outline-offset:2px}
  #answer.shake{animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .btn{
    appearance:none;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:10px 14px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    transition:background .15s,border-color .15s,color .15s;
  }
  .btn:hover{background:#1E2E3B;border-color:#33495A}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-solid{background:#fff;color:#0B1117;border-color:#fff;font-weight:700}
  .btn-solid:hover{background:#dfe7ec;border-color:#dfe7ec}
  .btn-amber{background:var(--amber);color:#22190A;border-color:var(--amber);font-weight:700}
  .btn-amber:hover{background:#ffc24d;border-color:#ffc24d}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .choices .btn{text-transform:none;font-family:var(--sans);font-size:14px;letter-spacing:0;padding:11px}

  /* ---------- Karte ---------- */
  .mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;position:relative}
  svg#map{display:block;width:100%;height:auto;touch-action:manipulation}
  #map .st{
    fill:var(--land);stroke:var(--asphalt);stroke-width:1;stroke-linejoin:round;
    cursor:pointer;transition:fill .18s;
  }
  #map .st:hover{fill:var(--land-hi)}
  #map .st.solved{fill:#20503C;cursor:default}
  #map .st.solved:hover{fill:#20503C}
  #map .st.missed{fill:#4A3A2A}
  #map .st.sel{fill:var(--amber)}
  #map .st.flash-ok{fill:var(--ok)}
  #map .st.flash-bad{fill:var(--bad)}
  #map .st.reveal{fill:var(--amber);animation:pulse 1.1s ease-out 2}
  @keyframes pulse{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
  #map .lbl{
    font-family:var(--mono);font-size:11px;font-weight:600;fill:#CFEBDD;
    text-anchor:middle;dominant-baseline:middle;pointer-events:none;
    paint-order:stroke;stroke:rgba(11,17,23,.85);stroke-width:2.5px;
  }
  #map .st:focus-visible{outline:none;fill:var(--land-hi);stroke:var(--amber);stroke-width:2}
  .maptools{position:absolute;left:16px;bottom:16px;display:flex;gap:8px}
  .feedback{
    min-height:22px;margin-top:10px;font-size:14px;color:var(--muted);
  }
  .feedback b{color:var(--ink)}
  .feedback.ok{color:#7BD3A2}
  .feedback.bad{color:#F0847C}

  /* ---------- Seitenpanel ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .panel + .panel{margin-top:14px}
  .plabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .stats{display:flex;gap:18px;margin-bottom:12px}
  .stat .v{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:#1D2B36;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--ok);transition:width .35s}

  .hintlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .hint{
    background:var(--panel2);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;
    padding:10px 12px;font-size:14px;animation:slidein .25s ease-out;
  }
  @keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .hint .hk{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
  .empty{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .controls{display:flex;flex-wrap:wrap;gap:8px}
  .controls .btn{flex:1 1 auto}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  @media (max-width:900px){
    body{padding:12px}
    main{grid-template-columns:1fr}
    .maptools{position:static;margin-top:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------- Menü- & Feier-Overlay ---------- */
  .celebrate,.menu{
    position:fixed;inset:0;z-index:80;display:grid;place-items:center;
    background:rgba(6,10,14,.86);
  }
  .celebrate[hidden],.menu[hidden]{display:none}
  .celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
  .celebrate-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px}
  .celebrate-text{display:flex;gap:.06em;font-family:var(--sans);font-weight:800;line-height:1;font-size:clamp(64px,18vw,180px)}
  .celebrate-text[hidden]{display:none}
  .celebrate-text .letter{
    display:inline-block;transform:translateY(30px) scale(.6);opacity:0;
    animation:letterPop .5s cubic-bezier(.2,1.4,.4,1) forwards;
    text-shadow:0 6px 26px rgba(0,0,0,.6);
  }
  .celebrate-text .letter:nth-child(1){color:#D0483F;animation-delay:0s}
  .celebrate-text .letter:nth-child(2){color:#F4F7F9;animation-delay:.12s}
  .celebrate-text .letter:nth-child(3){color:#5C7CFA;animation-delay:.24s}
  @keyframes letterPop{to{transform:translateY(0) scale(1);opacity:1}}
  .celebrate-sub{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78);text-align:center}
  .celebrate-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .flag-ch{
    width:min(46vw,200px);aspect-ratio:1/1;background:#D52B1E;position:relative;
    border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);
    transform:scale(.6);opacity:0;animation:letterPop .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .flag-ch[hidden]{display:none}
  .flag-ch::before,.flag-ch::after{content:"";position:absolute;background:#fff}
  .flag-ch::before{left:42%;right:42%;top:20%;bottom:20%}
  .flag-ch::after{top:42%;bottom:42%;left:20%;right:20%}
  .menu-title{font-size:clamp(22px,4vw,30px);font-weight:800;color:var(--ink)}
  .menu-grid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .menu-card{
    appearance:none;cursor:pointer;text-align:left;min-width:220px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;display:flex;flex-direction:column;gap:6px;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .menu-card:hover{border-color:var(--amber);background:#1E2E3B;transform:translateY(-2px)}
  .menu-card-title{font-size:26px;font-weight:800;color:var(--ink)}
  .menu-card-sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="shield" id="shieldCount">50</div>
      <div>
        <h1>Staatenkunde</h1>
        <p class="tag" id="tagLine">Die 50 Bundesstaaten der USA</p>
      </div>
    </div>
    <div class="headerRight">
      <button class="btn" id="menuBtn">Menü</button>
      <nav class="modes" role="tablist" aria-label="Spielmodus">
        <button class="tab" role="tab" id="tab-find" aria-selected="true" data-mode="find">Modus 1 · Finden</button>
        <button class="tab" role="tab" id="tab-name" aria-selected="false" data-mode="name">Modus 2 · Benennen</button>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="sign" id="sign">
        <div class="sign-inner">
          <div class="eyebrow" id="signEyebrow">Finde diesen Staat</div>
          <div class="headline" id="signHead">—</div>
          <div class="sub" id="signSub"></div>
          <div class="answerbar" id="answerbar" hidden>
            <input id="answer" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Name eingeben …" aria-label="Name des Staates">
            <button class="btn btn-solid" id="submit">Prüfen</button>
          </div>
          <div class="choices" id="choices" hidden></div>
        </div>
      </div>

      <div class="mapwrap">
        <svg id="map" viewBox="0 0 960 600" role="application" aria-label="Karte der USA"></svg>
        <div class="maptools">
          <button class="btn" id="zoom">Nordosten heranzoomen</button>
        </div>
      </div>
      <div class="feedback" id="feedback"></div>
    </section>

    <aside>
      <div class="panel">
        <p class="plabel">Stand</p>
        <div class="stats">
          <div class="stat"><div class="v" id="stSolved">0</div><div class="k" id="stTotalLabel">von 50</div></div>
          <div class="stat"><div class="v" id="stScore">0</div><div class="k">Punkte</div></div>
          <div class="stat"><div class="v" id="stStreak">0</div><div class="k">Serie</div></div>
        </div>
        <div class="bar"><span id="progress"></span></div>
        <div class="legend">
          <span><i style="background:#20503C"></i>gewusst</span>
          <span><i style="background:#4A3A2A"></i>aufgelöst</span>
          <span><i style="background:var(--amber)"></i>aktiv</span>
        </div>
      </div>

      <div class="panel">
        <p class="plabel">Hinweise</p>
        <div class="hintlist" id="hints"></div>
        <p class="empty" id="hintEmpty">Noch kein Hinweis geöffnet. Jeder Hinweis kostet einen Punkt.</p>
        <button class="btn btn-amber" id="hintBtn" style="width:100%">Hinweis öffnen · 3 übrig</button>
      </div>

      <div class="panel">
        <p class="plabel">Steuerung</p>
        <div class="controls">
          <button class="btn" id="skip">Überspringen</button>
          <button class="btn" id="solve">Auflösen</button>
          <button class="btn" id="reset">Neu starten</button>
        </div>
      </div>
    </aside>
  </main>

  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Land wählen">
    <div class="celebrate-inner">
      <p class="celebrate-sub">Staatenkunde</p>
      <div class="menu-title">Wähle ein Land</div>
      <div class="menu-grid">
        <button class="menu-card" data-country="usa">
          <span class="menu-card-title">USA</span>
          <span class="menu-card-sub">50 Bundesstaaten</span>
        </button>
        <button class="menu-card" data-country="ch">
          <span class="menu-card-title">Schweiz</span>
          <span class="menu-card-sub">26 Kantone</span>
        </button>
      </div>
    </div>
  </div>

  <div class="celebrate" id="celebrate" hidden role="dialog" aria-modal="true" aria-label="Alle Staaten geschafft">
    <canvas id="fwCanvas"></canvas>
    <div class="celebrate-inner">
      <div class="celebrate-text"><span class="letter">U</span><span class="letter">S</span><span class="letter">A</span></div>
      <div class="flag-ch" id="flagCh" hidden></div>
      <p class="celebrate-sub" id="celebrateSub"></p>
      <div class="celebrate-actions">
        <button class="btn btn-solid" id="celebrateRestart">Neu starten</button>
        <button class="btn" id="celebrateMenu">Zurück zum Menü</button>
      </div>
    </div>
  </div>
</div>

function buildSwissGeo(){
  const geo = {};
  let maxX=0, maxY=0;
  for(const n in CH_SHAPE){
    const s = CH_SHAPE[n];
    const rot = (s.rot||0)*Math.PI/180, cos=Math.cos(rot), sin=Math.sin(rot);
    const pts=[];
    for(let i=0;i<s.n;i++){
      const a = (Math.PI*2*i)/s.n - Math.PI/2;
      const w = s.wobble ? s.wobble[i%s.wobble.length] : 1;
      const ex = s.rx*w*Math.cos(a), ey = s.ry*w*Math.sin(a);
      const x = s.cx + ex*cos - ey*sin;
      const y = s.cy + ex*sin + ey*cos;
      pts.push(x.toFixed(1)+","+y.toFixed(1));
      maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
    }
    geo[n] = {d:"M"+pts.join("L")+"Z", c:[s.cx,s.cy]};
  }
  return {geo, viewBox:`0 0 ${Math.ceil(maxX+30)} ${Math.ceil(maxY+30)}`};
}

/* ---------- Hilfsfunktionen ---------- */
const norm = s => s.toLowerCase().trim()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .replace(/[^a-z]/g,"");

function lev(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>3) return 9;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}

function matchState(input){
  const q = norm(input);
  if(q.length < 3) return null;
  for(const n of NAMES){
    if(norm(n)===q) return {name:n,typo:false};
    if((DATA[n].de||[]).some(a=>norm(a)===q)) return {name:n,typo:false};
  }
  const tol = q.length<=5 ? 1 : q.length<=9 ? 2 : 3;
  const hits = NAMES.filter(n=>{
    const cands=[n,...(DATA[n].de||[])];
    return cands.some(c=>lev(norm(c),q)<=tol);
  });
  return hits.length===1 ? {name:hits[0],typo:true} : null;
}

const shuffle = a => {
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
};

/* ---------- Zustand ---------- */
function freshSession(){
  return {queue:shuffle(NAMES),current:null,solved:new Set(),missed:new Set(),hints:0,wrong:0,score:0,streak:0,revealed:0,locked:false,choicesShown:false,celebrated:false};
}
const S = {mode:"find", find:freshSession(), name:freshSession()};
const cur = () => S[S.mode];

/* ---------- Karte bauen ---------- */
const svg = document.getElementById("map");
const SVGNS = "http://www.w3.org/2000/svg";
const gShapes = document.createElementNS(SVGNS,"g");
const gLabels = document.createElementNS(SVGNS,"g");
svg.append(gShapes,gLabels);
let shapes = {};

function buildMap(){
  gShapes.textContent="";
  gLabels.textContent="";
  shapes = {};
  for(const n of NAMES){
    const p = document.createElementNS(SVGNS,"path");
    p.setAttribute("d",GEO[n].d);
    p.setAttribute("class","st");
    p.setAttribute("tabindex","0");
    p.setAttribute("role","button");
    p.setAttribute("aria-label",`${unitLabel(false)} auf der Karte`);
    p.addEventListener("click",()=>onPick(n));
    p.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onPick(n);}});
    gShapes.appendChild(p);
    shapes[n]=p;
  }
}

function drawLabels(){
  gLabels.textContent="";
  const s=cur();
  for(const n of NAMES){
    if(!s.solved.has(n) && !s.missed.has(n)) continue;
    const t=document.createElementNS(SVGNS,"text");
    t.setAttribute("class","lbl");
    t.setAttribute("x",GEO[n].c[0]);
    t.setAttribute("y",GEO[n].c[1]);
    t.textContent=DATA[n].ab;
    if(!s.solved.has(n) && s.missed.has(n)) t.style.fill="#E6C79A";
    gLabels.appendChild(t);
  }
}

function paint(){
  const s=cur();
  for(const n of NAMES){
    const el=shapes[n];
    el.classList.remove("solved","missed","sel");
    if(s.solved.has(n)) el.classList.add("solved");
    else if(s.missed.has(n)) el.classList.add("missed");
    if(S.mode==="name" && s.current===n) el.classList.add("sel");
  }
  drawLabels();
}

function flash(name,kind,ms){
  const el=shapes[name];
  el.classList.add(kind);
  setTimeout(()=>{el.classList.remove(kind);paint();},ms);
}

function hintsFor(name){
  const d=DATA[name];
  if(S.mode==="find"){
    return [["Lage",d.lage],["Merkmal",d.fakt],[capLabel(),d.cap]];
  }
  const letters=[...name].filter(ch=>/\p{L}/u.test(ch)).length;
  return [["Merkmal",d.fakt],[capLabel(),d.cap],["Buchstaben",`Beginnt mit „${name[0]}“ und hat ${letters} Buchstaben.`]];
}

function renderHints(){
  const s=cur();
  hintsBox.textContent="";
  if(!s.current){
    hintEmpty.hidden=false;
    hintEmpty.textContent = S.mode==="find" ? "Noch kein Hinweis geöffnet." : `Klick zuerst einen ${unitLabel(false)} auf der Karte an.`;
    hintBtn.disabled=true;
    hintBtn.textContent="Hinweis öffnen · 3 übrig";
    return;
  }
  const list=hintsFor(s.current);
  for(let i=0;i<s.hints;i++){
    const d=document.createElement("div");
    d.className="hint";
    d.innerHTML=`<span class="hk">Hinweis ${i+1} · ${list[i][0]}</span>${list[i][1]}`;
    hintsBox.appendChild(d);
  }
  hintEmpty.hidden = s.hints>0;
  if(s.hints===0) hintEmpty.textContent="Noch kein Hinweis geöffnet. Jeder Hinweis kostet einen Punkt.";
  const left=3-s.hints;
  hintBtn.disabled = left===0 || s.locked;
  hintBtn.textContent = left>0 ? `Hinweis öffnen · ${left} übrig` : "Alle Hinweise offen";
}

function renderStats(){
  const s=cur();
  el("stTotalLabel").textContent="von "+NAMES.length;
  el("stSolved").textContent=s.solved.size;
  el("stScore").textContent=s.score;
  el("stStreak").textContent=s.streak;
  const done = S.mode==="find" ? s.solved.size : s.solved.size+s.missed.size;
  el("progress").style.width=(100*done/NAMES.length)+"%";
}

function renderSign(){
  const s=cur();
  choicesBox.hidden=true; choicesBox.textContent="";
  if(S.mode==="find"){
    answerbar.hidden=true;
    if(!s.current){
      sign.classList.add("is-idle");
      signEyebrow.textContent="Fertig";
      signHead.textContent=`Alle ${NAMES.length} durch`;
      signSub.textContent=`Alle ${unitLabel(true)} gefunden, ${s.revealed}× musstest du auflösen. Mit „Neu starten“ geht es wieder los.`;
      return;
    }
    sign.classList.remove("is-idle");
    signEyebrow.textContent=`Finde diesen ${unitLabel(false)} · Nr. ${s.solved.size+1} von ${NAMES.length}`;
    signHead.textContent=s.current;
    signSub.textContent="Klick ihn auf der Karte an.";
  }else{
    if(!s.current){
      sign.classList.add("is-idle");
      answerbar.hidden=true;
      signEyebrow.textContent="Modus 2 · Benennen";
      signHead.textContent = s.solved.size+s.missed.size>=NAMES.length ? `Alle ${NAMES.length} benannt` : `Klick einen ${unitLabel(false)} an`;
      signSub.textContent = s.solved.size+s.missed.size>=NAMES.length ? "Mit „Neu starten“ geht es wieder los." : "Such dir einen aus — oder lass dir mit „Überspringen“ einen zuteilen.";
      return;
    }
    sign.classList.remove("is-idle");
    answerbar.hidden=false;
    signEyebrow.textContent=`Wie heisst dieser ${unitLabel(false)}? · ${s.solved.size+s.missed.size} von ${NAMES.length} erledigt`;
    signHead.textContent="?";
    signSub.textContent="Er ist auf der Karte gelb markiert.";
    if(s.choicesShown) showChoices();
  }
}

function render(){ paint(); renderSign(); renderHints(); renderStats(); }

/* ---------- Punkte ---------- */
function award(){
  const s=cur();
  const p=Math.max(0,3-s.hints-s.wrong);
  s.score+=p;
  s.streak = s.wrong===0 ? s.streak+1 : 0;
  return p;
}

/* ---------- Modus 1: Finden ---------- */
function nextFind(){
  const s=S.find;
  s.current = s.queue.length ? s.queue.shift() : null;
  s.hints=0; s.wrong=0; s.locked=false;
  render();
}

function onPickFind(name){
  const s=S.find;
  if(s.locked || !s.current) return;
  if(name===s.current){
    const p=award();
    s.solved.add(name); s.missed.delete(name);
    flash(name,"flash-ok",520);
    say(`Richtig — <b>${name}</b>. +${p} Punkt${p===1?"":"e"}.`,"ok");
    s.locked=true;
    if(s.solved.size===NAMES.length && !s.celebrated){ s.celebrated=true; celebrate(); }
    setTimeout(nextFind,650);
  }else{
    s.wrong++;
    flash(name,"flash-bad",420);
    if(s.wrong>=3){
      revealFind("Dritter Fehlversuch.");
    }else{
      say(`Das war <b>${name}</b>. Noch ${3-s.wrong} Versuch${3-s.wrong===1?"":"e"} — oder öffne einen Hinweis.`,"bad");
      renderStats();
    }
  }
}

function revealFind(prefix){
  const s=S.find;
  if(!s.current||s.locked) return;
  const n=s.current;
  s.missed.add(n);
  s.revealed++;
  s.queue.push(n);
  s.streak=0;
  s.locked=true;
  shapes[n].classList.add("reveal");
  say(`${prefix?prefix+" ":""}Hier liegt <b>${n}</b> — ${capLabel()} ${DATA[n].cap}. Kommt später nochmal dran.`,"bad");
  setTimeout(()=>{shapes[n].classList.remove("reveal");nextFind();},2300);
}

/* ---------- Modus 2: Benennen ---------- */
function onPickName(name){
  const s=S.name;
  if(s.locked) return;
  if(s.solved.has(name)||s.missed.has(name)){
    say(`<b>${name}</b> ist schon erledigt. ${capLabel()}: ${DATA[name].cap}.`);
    return;
  }
  s.current=name; s.hints=0; s.wrong=0; s.choicesShown=false;
  say("");
  render();
  answer.value=""; answer.focus();
}

function checkName(){
  const s=S.name;
  if(!s.current||s.locked) return;
  const m=matchState(answer.value);
  if(m && m.name===s.current){
    const p=award();
    s.solved.add(s.current);
    flash(s.current,"flash-ok",520);
    say(`${m.typo?`Kleiner Tippfehler, zählt trotzdem — richtige Schreibweise: `:"Richtig — "}<b>${s.current}</b>. +${p} Punkt${p===1?"":"e"}.`,"ok");
    s.current=null; answer.value="";
    render();
    if(s.solved.size===NAMES.length && !s.celebrated){ s.celebrated=true; celebrate(); }
    return;
  }
  s.wrong++;
  answer.classList.remove("shake"); void answer.offsetWidth; answer.classList.add("shake");
  if(m) say(`<b>${m.name}</b> liegt woanders. Versuch's nochmal.`,"bad");
  else say(`Den Namen kenne ich nicht. Achte auf die Schreibweise.`,"bad");
  answer.select();
  if(s.wrong>=2 && !s.choicesShown){ s.choicesShown=true; showChoices(); }
  renderStats();
}

function showChoices(){
  const s=S.name;
  if(!s.current) return;
  const pool=shuffle(NAMES.filter(n=>n!==s.current)).slice(0,3);
  const opts=shuffle([s.current,...pool]);
  choicesBox.textContent="";
  for(const o of opts){
    const b=document.createElement("button");
    b.className="btn"; b.textContent=o;
    b.addEventListener("click",()=>{answer.value=o;checkName();});
    choicesBox.appendChild(b);
  }
  choicesBox.hidden=false;
}

function revealName(){
  const s=S.name;
  if(!s.current||s.locked) return;
  const n=s.current;
  s.missed.add(n); s.streak=0;
  say(`Das ist <b>${n}</b> — ${capLabel()} ${DATA[n].cap}. ${DATA[n].fakt}`,"bad");
  s.current=null; answer.value="";
  render();
}

/* ---------- gemeinsame Handler ---------- */
function onPick(name){
  if(S.mode==="find") onPickFind(name); else onPickName(name);
}

hintBtn.addEventListener("click",()=>{
  const s=cur();
  if(!s.current||s.hints>=3) return;
  s.hints++;
  renderHints(); renderStats();
});

el("submit").addEventListener("click",checkName);
answer.addEventListener("keydown",e=>{if(e.key==="Enter")checkName();});

skipBtn.addEventListener("click",()=>{
  const s=cur();
  if(S.mode==="find"){
    if(!s.current) return;
    s.queue.push(s.current); s.streak=0;
    say(`<b>${s.current}</b> kommt später nochmal.`);
    nextFind();
  }else{
    const open=NAMES.filter(n=>!s.solved.has(n)&&!s.missed.has(n));
    if(!open.length) return;
    onPickName(open[Math.floor(Math.random()*open.length)]);
    say("Zufällig ausgewählt — er ist gelb markiert.");
  }
});

solveBtn.addEventListener("click",()=>{
  if(S.mode==="find") revealFind(""); else revealName();
});

function restartCurrentMode(){
  S[S.mode]=freshSession();
  if(S.mode==="find") nextFind(); else {say(`Neu gestartet. Klick einen ${unitLabel(false)} an.`);render();}
}
el("reset").addEventListener("click",restartCurrentMode);

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
    S.mode=t.dataset.mode;
    say("");
    if(S.mode==="find" && !S.find.current && S.find.queue.length) nextFind();
    else render();
    if(S.mode==="name" && S.name.current) answer.focus();
  });
});

const zoomBtn=el("zoom");
let zoomed=false;
zoomBtn.addEventListener("click",()=>{
  zoomed=!zoomed;
  svg.setAttribute("viewBox",zoomed?NE_VIEW:FULL_VIEW);
  zoomBtn.textContent=zoomed?"Ganze USA zeigen":"Nordosten heranzoomen";
});

/* ---------- Feier: Feuerwerk bei perfekter Runde ---------- */
const celebrateEl = el("celebrate");
const celebrateSub = el("celebrateSub");
const usaLettersEl = document.querySelector(".celebrate-text");
const chFlagEl = el("flagCh");
const fwCanvas = el("fwCanvas");
const fwCtx = fwCanvas.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FLAG_COLORS_USA = ["#D0483F","#F4F7F9","#5C7CFA"];
const FLAG_COLORS_CH = ["#D52B1E","#F4F7F9"];
let fwColors = FLAG_COLORS_USA;
let fwParticles = [];
let fwRunning = false;
let fwRAF = null;
let fwLauncher = null;

function fwResize(){
  fwCanvas.width = celebrateEl.clientWidth;
  fwCanvas.height = celebrateEl.clientHeight;
}

function fwSpawnBurst(x,y){
  const n = 46;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.3;
    const speed = 2+Math.random()*3.6;
    fwParticles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,color:fwColors[Math.floor(Math.random()*fwColors.length)]});
  }
}

function fwStep(){
  fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
  for(const p of fwParticles){
    p.vy += 0.035; p.x += p.vx; p.y += p.vy; p.life -= 0.012;
  }
  fwParticles = fwParticles.filter(p=>p.life>0);
  for(const p of fwParticles){
    fwCtx.globalAlpha = Math.max(p.life,0);
    fwCtx.fillStyle = p.color;
    fwCtx.beginPath();
    fwCtx.arc(p.x,p.y,2.4,0,Math.PI*2);
    fwCtx.fill();
  }
  fwCtx.globalAlpha = 1;
  if(fwRunning) fwRAF = requestAnimationFrame(fwStep);
}

function fwLaunchLoop(){
  const w = fwCanvas.width, h = fwCanvas.height;
  fwSpawnBurst(w*(0.15+Math.random()*0.7), h*(0.2+Math.random()*0.45));
  fwLauncher = setTimeout(fwLaunchLoop, 380+Math.random()*420);
}

function restartCelebrateAnim(isCH){
  const targets = isCH ? [chFlagEl] : Array.from(usaLettersEl.children);
  targets.forEach(t=>{ t.style.animation="none"; void t.offsetWidth; t.style.animation=""; });
}

function celebrate(){
  const isCH = COUNTRY==="ch";
  fwColors = isCH ? FLAG_COLORS_CH : FLAG_COLORS_USA;
  usaLettersEl.hidden = isCH;
  chFlagEl.hidden = !isCH;
  restartCelebrateAnim(isCH);
  celebrateSub.textContent = `Alle ${NAMES.length} ${unitLabel(true)} ${S.mode==="find"?"gefunden":"korrekt benannt"} — Glückwunsch!`;
  celebrateEl.setAttribute("aria-label",`Alle ${unitLabel(true)} geschafft`);
  celebrateEl.hidden = false;
  fwResize();
  fwParticles = [];
  if(!reduceMotion){
    fwRunning = true;
    fwStep();
    fwLaunchLoop();
  }
}

function stopCelebrate(){
  celebrateEl.hidden = true;
  fwRunning = false;
  if(fwRAF) cancelAnimationFrame(fwRAF);
  if(fwLauncher) clearTimeout(fwLauncher);
  fwParticles = [];
}

window.addEventListener("resize",()=>{ if(!celebrateEl.hidden) fwResize(); });
el("celebrateRestart").addEventListener("click", ()=>{ stopCelebrate(); restartCurrentMode(); });
el("celebrateMenu").addEventListener("click", ()=>{ stopCelebrate(); openMenu(); });
celebrateEl.addEventListener("click", e=>{ if(e.target===celebrateEl) stopCelebrate(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !celebrateEl.hidden) stopCelebrate(); });

/* ---------- Menü: Land wählen ---------- */
const menuEl = el("menu");
const shieldEl = el("shieldCount");
const tagEl = el("tagLine");

function openMenu(){
  stopCelebrate();
  menuEl.hidden = false;
}

function selectCountry(id){
  COUNTRY = id;
  if(id==="usa"){
    DATA = DATA_USA;
    GEO = GEO_USA;
    VIEW_FULL = FULL_VIEW;
    zoomed = false;
    zoomBtn.hidden = false;
    zoomBtn.textContent = "Nordosten heranzoomen";
    shieldEl.textContent = "50";
    tagEl.textContent = "Die 50 Bundesstaaten der USA";
    document.title = "Staatenkunde — die 50 US-Bundesstaaten lernen";
  }else{
    DATA = DATA_CH;
    if(!chGeoCache) chGeoCache = buildSwissGeo();
    GEO = chGeoCache.geo;
    VIEW_FULL = chGeoCache.viewBox;
    zoomBtn.hidden = true;
    shieldEl.textContent = "26";
    tagEl.textContent = "Die 26 Kantone der Schweiz";
    document.title = "Staatenkunde — die 26 Schweizer Kantone lernen";
  }
  NAMES = Object.keys(DATA);
  svg.setAttribute("viewBox", VIEW_FULL);
  answer.setAttribute("aria-label", COUNTRY==="ch" ? "Name des Kantons" : "Name des Staates");
  S.mode = "find";
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(x.dataset.mode==="find")));
  S.find = freshSession();
  S.name = freshSession();
  buildMap();
  menuEl.hidden = true;
  say("");
  nextFind();
}

document.querySelectorAll(".menu-card").forEach(b=>{
  b.addEventListener("click", ()=>selectCountry(b.dataset.country));
});
el("menuBtn").addEventListener("click", openMenu);

/* ---------- Start ---------- */
openMenu();
</script>
